services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripistic-app
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    # BIND_ADDR exists because this VPS runs a managed Traefik that already
    # holds 172.16.0.1:8080. Publishing on 0.0.0.0 collides with it, and the
    # collision is invisible until the container fails to start. Setting
    # BIND_ADDR=<vps-ip> in .env binds Tripistic to its own address and leaves
    # Traefik alone.
    #
    # This replaces a docker-compose.override.yml that existed only on the
    # VPS: Compose *concatenates* `ports:` across -f files rather than
    # replacing them, so the override needed `!override` to work at all, and
    # rebuilding the box or deploying elsewhere silently lost the fix.
    # Defaulting to 0.0.0.0 keeps every other environment behaving as before.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:3000"

  # Single gate every deploy passes through: migrate -> seed -> backfill.
  # The app waits on this completing successfully, so it can never serve
  # traffic against an unseeded catalog. Runs in the `tooling` image, which
  # carries Prisma and tsx; the application image stays minimal and non-root.
  release:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    command: npm run db:release
    restart: "no"

  # Runs the scheduled jobs. Without this, seven classes of recurring work
  # never execute — most damagingly the sweep that releases seats held by
  # abandoned checkouts, so departures silently sell out to unpaid bookings.
  #
  # Uses the worker CLI rather than the HTTP route, so job execution is not
  # reachable from the internet at all and needs no shared secret.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    restart: unless-stopped
    depends_on:
      release:
        condition: service_completed_successfully
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    # A minute between ticks. Every job is an idempotent sweep guarded by a
    # PostgreSQL advisory lock, so overlapping or repeated ticks are safe.
    #
    # `sleep & wait` rather than a bare `sleep`: a plain `sleep` is not
    # interruptible by SIGTERM from this shell, so `docker compose down` would
    # block for the full stop timeout on every deploy. Backgrounding it and
    # waiting lets the trap fire immediately. A tick already in flight is not
    # killed mid-transaction — the advisory lock is released with the
    # connection either way, so the next container start is unaffected.
    stop_grace_period: 30s
    command: >-
      sh -c "trap 'exit 0' TERM INT;
      while true; do
      npm run --silent jobs:run || echo '[worker] tick failed';
      sleep 60 & wait $$!;
      done"

  # Nightly verified backups.
  #
  # Runs in the postgres image rather than the tooling image because it needs
  # `pg_dump`/`pg_restore` at the same major version as the server, and nothing
  # else. Writes to a host bind mount so the archives survive `compose down -v`
  # — a backup stored only in a Docker volume shares a fate with the database
  # it is protecting.
  #
  # Local archives do NOT survive losing the VPS. Sync ${BACKUP_HOST_DIR}
  # off-box; see docs/RUNBOOK-BACKUP-AND-ROLLBACK.md §1.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup-database.sh:/usr/local/bin/backup-database.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    stop_grace_period: 30s
    # A 24h loop rather than a cron daemon: one fewer moving part in the
    # image, and the container's own restart policy is the supervisor. Takes a
    # backup immediately on start so a fresh deployment is protected within
    # seconds rather than at the next midnight. Same TERM-trap shape as the
    # worker so `compose down` is not held up for a day.
    command: >-
      sh -c "trap 'exit 0' TERM INT;
      while true; do
      sh /usr/local/bin/backup-database.sh || echo '[backup] run failed';
      sleep 86400 & wait $$!;
      done"

  db:
    image: postgres:16-alpine
    container_name: tripistic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripistic}
      POSTGRES_USER: ${POSTGRES_USER:-tripistic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - tripistic_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripistic} -d ${POSTGRES_DB:-tripistic}"]
      interval: 10s
      timeout: 5s
      retries: 10

  tooling:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    # Plans and subscriptions are handled by the `release` service above.
    # This profile remains only for the optional platform-admin bootstrap,
    # which requires SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD to be set.
    command: npm run db:seed

volumes:
  tripistic_postgres:
