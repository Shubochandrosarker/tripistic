services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripistic-app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    ports:
      - "${HTTP_PORT:-8080}:3000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    command: npm run db:migrate
    restart: "no"

  db:
    image: postgres:16-alpine
    container_name: tripistic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripistic}
      POSTGRES_USER: ${POSTGRES_USER:-tripistic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - tripistic_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tripistic} -d ${POSTGRES_DB:-tripistic}"]
      interval: 10s
      timeout: 5s
      retries: 10

  tooling:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${TRIPISTIC_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tripistic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-tripistic}?schema=public
    command: npm run db:seed

volumes:
  tripistic_postgres:
