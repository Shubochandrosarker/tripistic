# Tripistic — auto-deploy to the Hostinger VPS.
#
# Fires only after the existing `CI` workflow finishes successfully on `main`
# (never deploys on red tests), or manually via workflow_dispatch.
#
# Setup: drop this at .github/workflows/deploy.yml and add these repo secrets
# (Settings -> Secrets and variables -> Actions):
#   VPS_HOST          VPS IP or hostname
#   VPS_SSH_USER      SSH user with access to the deploy path + docker group
#   VPS_SSH_KEY       Private key for a dedicated deploy keypair (not personal)
#   VPS_SSH_PORT      SSH port (omit to default to 22)
#   VPS_DEPLOY_PATH   Absolute path to the docker-compose.hostinger.yml directory
#
# Recommended: create a GitHub Environment named "production" (Settings ->
# Environments) and add yourself as a required reviewer for a manual approval
# gate before each auto-deploy, without editing this file.
#
# VPS-specific note (2026-08-08): the production env file on this VPS is
# named `.env`, not `.env.docker` (the compose file's own default). This
# workflow sources `.env` explicitly rather than relying on the default.
#
# It also picks up `docker-compose.override.yml` when present in the deploy
# path. On this VPS that file rebinds the app's published port to the
# server's public IP instead of 0.0.0.0, because a Hostinger-managed Traefik
# container also listens on the docker0 bridge gateway at the same port
# number and a wildcard bind collides with it. The override is VPS-local
# (not committed here) since it depends on that VPS's own IP and Traefik
# setup — see docker-compose.override.yml on the VPS for the full comment.
#
# Because that override binds to a specific IP rather than 0.0.0.0, the
# in-script health check below can't always reach it via 127.0.0.1. Set
# HEALTHCHECK_HOST in `.env` to whatever host:port is actually reachable
# from the VPS's own shell (on this VPS: HEALTHCHECK_HOST=147.93.104.126).
# Defaults to 127.0.0.1 when unset, which is correct for a plain 0.0.0.0
# publish.

name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            # This VPS's real env file is `.env` (not compose's default of
            # `.env.docker`). Export it both ways: TRIPISTIC_ENV_FILE feeds
            # the compose file's own `env_file: ${TRIPISTIC_ENV_FILE:-...}`
            # directive (what containers receive), and sourcing it here
            # makes the same values visible to this shell script.
            export TRIPISTIC_ENV_FILE=.env
            set -a
            # shellcheck disable=SC1091
            [ -f .env ] && . ./.env
            set +a

            # Pick up the VPS-local port-binding override if it exists.
            # See the header comment above for why.
            COMPOSE_FILES=(-f docker-compose.hostinger.yml)
            [ -f docker-compose.override.yml ] && COMPOSE_FILES+=(-f docker-compose.override.yml)

            PREV_COMMIT="$(git rev-parse HEAD)"
            echo "== current commit before deploy: ${PREV_COMMIT} =="

            mkdir -p backups
            echo "== pre-deploy database backup =="
            docker compose "${COMPOSE_FILES[@]}" exec -T db \
              pg_dump -U "${POSTGRES_USER:-tripistic}" "${POSTGRES_DB:-tripistic}" \
              | gzip > "backups/pre-deploy-$(date +%F-%H%M%S).sql.gz"

            echo "== fetching latest main =="
            git fetch origin main
            git reset --hard origin/main
            echo "== deploying commit: $(git rev-parse HEAD) =="

            echo "== building and releasing (migrate -> seed -> backfill -> app) =="
            docker compose "${COMPOSE_FILES[@]}" up -d --build

            echo "== waiting for /api/health/ready =="
            ok=false
            for i in $(seq 1 30); do
              if curl -fsS "http://${HEALTHCHECK_HOST:-127.0.0.1}:${HTTP_PORT:-8080}/api/health/ready" >/dev/null 2>&1; then
                ok=true
                break
              fi
              sleep 5
            done

            if [ "$ok" != "true" ]; then
              echo "!! app did not become healthy within 150s — rolling back to ${PREV_COMMIT} !!" >&2
              docker compose "${COMPOSE_FILES[@]}" logs --tail=200 app || true
              docker compose "${COMPOSE_FILES[@]}" logs --tail=100 release || true
              git reset --hard "${PREV_COMMIT}"
              docker compose "${COMPOSE_FILES[@]}" up -d --build
              echo "rolled back to ${PREV_COMMIT}" >&2
              exit 1
            fi

            echo "== deploy successful: $(git rev-parse HEAD) =="
            docker compose "${COMPOSE_FILES[@]}" ps
